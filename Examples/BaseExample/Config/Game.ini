; Settings of the BaseExample project when chGame plays it. Each value can be changed in
; /Saved/Config/Game.ini and on the command line (-Section.Key=Value).
; The values below are commented out because the code already uses them.

[Game]
; Scene chGame opens: a virtual path such as /Game/Maps/Main, or a scene name. Alias -Scene.
;StartupScene=/Game/Maps/Main
; UI document drawn over the scene: a virtual path such as /Game/UI/Hud, or a document name.
; Empty or missing uses the sample HUD built in code.
;HudDocument=/Game/UI/Hud
