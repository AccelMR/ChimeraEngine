; Input actions of the 2D example (format in the engine's Config/Input.ini).

[Move]
Type=Axis2D
Keys=W:+Y, S:-Y, D:+X, A:-X, Up:+Y, Down:-Y, Right:+X, Left:-X, GamepadLeftStick

[Fire]
Type=Button
Keys=Space, GamepadSouth, MouseLeft

[Restart]
Type=Button
Keys=R, GamepadStart

; Turns the stress test on and off (its counts are properties of the Game object).
[Stress]
Type=Button
Keys=P, GamepadBack
