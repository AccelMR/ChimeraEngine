services:
  runner:
    build: .
    image: chimera-ci-runner
    container_name: chimera-ci-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/AccelMR/ChimeraEngine
      RUNNER_NAME: chimera-linux
      # Only needed the first time; afterwards the registration lives in the state volume.
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    volumes:
      - state:/home/runner/state
      - work:/home/runner/work
      - ccache:/home/runner/.ccache

volumes:
  state:
  work:
  ccache:
